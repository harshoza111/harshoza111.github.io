<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Outer background circle -->
  <circle cx="120" cy="120" r="118" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="3" />
  
  <!-- Subtle tech grid -->
  <circle cx="120" cy="120" r="110" fill="url(#gridPattern)" />

  <!-- Inner decorative ring -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Monogram Initials -->
  <text x="120" y="132" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="800" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="2">HO</text>

  <!-- Subtitle badge inside avatar -->
  <rect x="70" y="152" width="100" height="22" rx="11" fill="rgba(59, 130, 246, 0.18)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
  <text x="120" y="167" 
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
        font-size="10.5" 
        font-weight="600" 
        fill="#60a5fa" 
        text-anchor="middle" 
        letter-spacing="1">AI / ML</text>
</svg>

